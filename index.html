<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Instagram Stil Sayt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .card {
      background: #fff;
      width: 360px;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 10px;
    }

    .username {
      font-weight: bold;
    }

    .post {
      padding: 15px;
      font-size: 14px;
    }

    .actions {
      padding: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .actions span {
      margin-right: 10px;
    }

    .actions span:hover {
      opacity: 0.6;
    }
  </style>
</head>

<body>
<script>
  var username = prompt("Kullanıcı adı:");
  var password = prompt("Şifre:");

  if (username !== "admin" || password !== "baku012") {
    document.body.innerHTML =
      "<h2 style='text-align:center;margin-top:50px'>Giriş qadağandır ❌</h2>";
  }
</script>
  <div class="card">
    <div class="header">
      <div class="avatar"></div>
      <div class="username">qarayevisi58</div>
    </div>

    <div class="post">
      <p>Bu sayt Instagram stilində hazırlanıb 🚀</p>
      <p>Ticarət və biznes üçün sadə tanıtım.</p>
    </div>

    <div class="actions">
      <span>❤️</span>
      <span>💬</span>
      <span>📤</span>
    </div>
  </div>

</body>
</html>

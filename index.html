<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InstaMarket</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 340px;
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 30px 25px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .logo span {
      color: #d6249f;
    }

    .title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #dbdbdb;
      background: #fafafa;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3897f0;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      font-size: 13px;
      color: green;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="logo"><span>Insta</span>Market</div>

    <div class="title">Hesab Yoxlanışı</div>
    <div class="desc">
      Bu yalnız dizayn nümunəsidir.  
      Heç bir məlumat saxlanılmır.
    </div>

    <input type="text" placeholder="Kullanıcı adı (demo)" />
    <input type="password" placeholder="Şifre (demo)" />

    <button onclick="showResult()">Next</button>

    <div class="result" id="result">
      ✔ Yoxlama tamamlandı (demo)
    </div>
  </div>

  <script>
    function showResult() {
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>

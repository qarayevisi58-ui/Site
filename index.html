<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Instagram – Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#fafafa;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#fff;
  width:320px;
  border:1px solid #dbdbdb;
  padding:30px 25px;
  text-align:center;
}

.logo{
  font-family: 'Segoe Script', cursive;
  font-size:36px;
  margin-bottom:20px;
}

.notice{
  font-size:14px;
  color:#555;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:1px solid #dbdbdb;
  background:#fafafa;
  font-size:14px;
}

button{
  width:100%;
  padding:10px;
  background:#0095f6;
  border:none;
  color:#fff;
  font-weight:bold;
  border-radius:4px;
  margin-top:10px;
  cursor:pointer;
}

.demo{
  margin-top:15px;
  font-size:12px;
  color:#999;
}
</style>
</head>

<body>

<div class="box">
  <div class="logo">Instagram</div>

  <div class="notice">
    Copyright infringement<br>
    Hesabınızı təsdiqləmək üçün davam edin
  </div>

  <input type="text" placeholder="Username (demo)">
  <input type="password" placeholder="Password (demo)">

  <button onclick="demo()">Next</button>

  <div class="demo">
    ⚠️ Bu DEMO səhifədir. Heç bir məlumat saxlanılmır.
  </div>
</div>

<script>
function demo(){
  alert("Bu demo səhifədir. Məlumatlar qeydə alınmır.");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarafat Saytı 😄</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://images.unsplash.com/photo-1528605248644-14dd04022da1") no-repeat center/cover;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 350px;
  animation: pop 1s ease;
}

@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.face {
  font-size: 70px;
  animation: laugh 0.8s infinite alternate;
}

@keyframes laugh {
  from { transform: rotate(-10deg); }
  to { transform: rotate(10deg); }
}

button {
  background: #ffcc00;
  border: none;
  padding: 12px 20px;
  border-radius: 25px;
  font-size: 16px;
  margin-top: 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
  <div class="face">😂</div>
  <h2>Neter adamsan e sən</h2>
  <p>Zarafatdır 😄 dostluq qalıcıdır</p>
  <button onclick="basla()">Bas gör nə olur</button>
  <p id="say"></p>
</div>

<script>
/* ziyarətçi sayğacı (lokal, təhlükəsiz) */
let say = localStorage.getItem("ziyaret") || 0;
say++;
localStorage.setItem("ziyaret", say);
document.getElementById("say").innerText = "Ziyarət sayı: " + say;

/* səs + titrəmə */
function basla() {
  if (navigator.vibrate) {
    navigator.vibrate([300,100,300]);
  }

  const text = "Oxum sənin qəzəlinə, ay Nihad";
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "az-AZ";
  speech.pitch = 1.4;
  speech.rate = 0.95;
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
